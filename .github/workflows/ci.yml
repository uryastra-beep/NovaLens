name: Python Checks

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install runtime dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q app_info.py audio_indicator.py backend.py bubble_layout.py config.py config_manager.py control_bubble.py launcher.py localization.py main.py multimodal.py native_clickthrough.py popup.py popup_exe.py popup_layout.py reporting.py rolling_audio.py screen_selector.py

      - name: Run regression tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
