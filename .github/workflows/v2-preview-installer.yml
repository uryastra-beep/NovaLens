name: Build Nova Lens 2.0.0 Preview Installer

on:
  push:
    branches:
      - feature/v2.0.0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novalens-v2-preview-installer
  cancel-in-progress: true

jobs:
  build-installer:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install runtime dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q app_info.py audio_indicator.py backend.py bubble_layout.py config.py config_manager.py control_bubble.py launcher.py localization.py main.py multimodal.py native_clickthrough.py popup.py popup_exe.py popup_layout.py reporting.py rolling_audio.py screen_selector.py

      - name: Run regression tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Build portable app and Windows installer
        shell: pwsh
        run: .\build_installer.ps1

      - name: Upload preview installer
        uses: actions/upload-artifact@v4
        with:
          name: NovaLens-v2.0.0-Preview-Installer
          path: |
            installer-output/NovaLens-Setup-v2.0.0-Windows-x64.exe
            installer-output/NovaLens-Setup-v2.0.0-Windows-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14

