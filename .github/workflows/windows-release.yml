# Official Nova Lens v1.1.0 release automation
name: Publish Windows Release

# Publishing a release is an explicit action. Normal pushes and merged pull
# requests must never publish production artifacts automatically.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novalens-v1.1.0-release
  cancel-in-progress: false

env:
  RELEASE_TAG: v1.1.0
  RELEASE_TITLE: Nova Lens v1.1.0 — Screen, Audio & Floating Controls
  RELEASE_ASSET: NovaLens-v1.1.0-Windows-x64.zip
  RELEASE_CHECKSUM: NovaLens-v1.1.0-Windows-x64.zip.sha256

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check whether the release already exists
        id: release_check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Release $env:RELEASE_TAG already exists. Nothing will be overwritten."
          }
          else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Set up Python
        if: steps.release_check.outputs.exists == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install runtime dependencies for checks
        if: steps.release_check.outputs.exists == 'false'
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        if: steps.release_check.outputs.exists == 'false'
        shell: pwsh
        run: python -m compileall -q audio_indicator.py backend.py bubble_layout.py config.py config_manager.py control_bubble.py launcher.py localization.py main.py multimodal.py native_clickthrough.py popup.py popup_exe.py rolling_audio.py screen_selector.py

      - name: Run regression tests
        if: steps.release_check.outputs.exists == 'false'
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Build executable, ZIP, and checksum
        if: steps.release_check.outputs.exists == 'false'
        shell: pwsh
        run: .\build_exe.ps1

      - name: Publish GitHub release
        if: steps.release_check.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG `
            $env:RELEASE_ASSET `
            $env:RELEASE_CHECKSUM `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title $env:RELEASE_TITLE `
            --notes-file RELEASE_NOTES_v1.1.0.md `
            --latest

      - name: Upload build backup
        if: steps.release_check.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: NovaLens-v1.1.0-Windows-x64
          path: |
            NovaLens-v1.1.0-Windows-x64.zip
            NovaLens-v1.1.0-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
