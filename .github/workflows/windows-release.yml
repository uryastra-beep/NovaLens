# Official Nova Lens v1.0.1 release automation
name: Publish Windows Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novalens-v1.0.1-release
  cancel-in-progress: false

env:
  RELEASE_TAG: v1.0.1
  RELEASE_TITLE: Nova Lens v1.0.1 — First Windows Release
  RELEASE_ASSET: NovaLens-v1.0.1-Windows-x64.zip
  RELEASE_CHECKSUM: NovaLens-v1.0.1-Windows-x64.zip.sha256

jobs:
  publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check whether the release already exists
        id: release_check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Release $env:RELEASE_TAG already exists. Nothing will be overwritten."
          }
          else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Set up Python
        if: steps.release_check.outputs.exists == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Build executable, ZIP, and checksum
        if: steps.release_check.outputs.exists == 'false'
        shell: pwsh
        run: .\build_exe.ps1

      - name: Publish GitHub release
        if: steps.release_check.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG `
            $env:RELEASE_ASSET `
            $env:RELEASE_CHECKSUM `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title $env:RELEASE_TITLE `
            --notes-file RELEASE_NOTES_v1.0.1.md `
            --latest

      - name: Upload build backup
        if: steps.release_check.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: NovaLens-v1.0.1-Windows-x64
          path: |
            NovaLens-v1.0.1-Windows-x64.zip
            NovaLens-v1.0.1-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
