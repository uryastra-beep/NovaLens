name: Build Nova Lens 2.0.1 Release Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novalens-v2-release-installer
  cancel-in-progress: true

env:
  NOVALENS_VERSION: 2.0.1
  INSTALLER_EXE: installer-output/NovaLens-Setup-v2.0.1-Windows-x64.exe

jobs:
  build-release-installer:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout official release source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install runtime dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Verify release version
        shell: pwsh
        run: |
          $actual = (python -c "from app_info import APP_VERSION; print(APP_VERSION)").Trim()
          if ($actual -ne $env:NOVALENS_VERSION) {
            throw "app_info.py reports $actual; expected $env:NOVALENS_VERSION."
          }

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q app_info.py audio_indicator.py backend.py bubble_layout.py config.py config_manager.py control_bubble.py launcher.py localization.py main.py multimodal.py native_clickthrough.py popup.py popup_exe.py popup_layout.py reporting.py restart_prompt.py rolling_audio.py runtime_control.py screen_selector.py

      - name: Run regression tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Build portable ZIP and Windows installer
        shell: pwsh
        run: .\build_installer.ps1

      - name: Verify official release asset
        shell: pwsh
        run: |
          if (-not (Test-Path $env:INSTALLER_EXE)) {
            throw "Required release asset was not created: $env:INSTALLER_EXE"
          }

      - name: Upload official v2.0.1 installer
        uses: actions/upload-artifact@v4
        with:
          name: NovaLens-v2.0.1-Release-Installer
          path: |
            ${{ env.INSTALLER_EXE }}
          if-no-files-found: error
          retention-days: 30
