name: Build Windows Beta

on:
  workflow_dispatch:
  push:
    branches:
      - dev/exe-v1.0.1
    paths:
      - "*.py"
      - "requirements*.txt"
      - "build_exe.ps1"
      - ".github/workflows/windows-beta-build.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Build executable and release ZIP
        shell: pwsh
        run: .\build_exe.ps1

      - name: Upload Windows beta
        uses: actions/upload-artifact@v4
        with:
          name: NovaLens-v1.0.1-beta.1-Windows-x64
          path: NovaLens-v1.0.1-beta.1-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
